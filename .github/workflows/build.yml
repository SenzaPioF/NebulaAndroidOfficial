name: Crea l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      con_volti:
        description: "Includi il riconoscimento dei volti (OpenCV, APK più grande)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila (debug)
        run: gradle assembleDebug --no-daemon --stacktrace -PwithFaces=${{ inputs.con_volti && 'true' || 'false' }}

      - name: Impronta SHA-1 della firma (serve per l'accesso a Google)
        run: keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-apk
          path: app/build/outputs/apk/debug/*.apk
